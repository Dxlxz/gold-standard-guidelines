name: Report a defect in a standard
description: A rule is wrong, unverifiable, unsourced, contradictory, or the document is malformed
title: "[defect] <document id>: <short description>"
labels: ["defect", "needs-triage"]
body:
  - type: input
    id: doc
    attributes:
      label: Document id and section
      description: Stable id from the front matter, plus the section number if you know it. Example: `design-tokens §2.4`.
      placeholder: design-tokens §2.4
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of defect
      options:
        - Rule is incorrect or unsafe (would cause a real defect if followed)
        - Rule is not verifiable in review (cannot be checked against a diff/test/query)
        - Contradicts another standard
        - Unsourced claim or invented reference
        - Broken link, typo, malformed markdown, front-matter/metadata error
        - Missing topic — no standard owns this concern
        - Other
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Quote the offending text and show why it fails — a link, a failing example, a counter-source, or the contradicting rule in the other document (id + quoted text).
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix (optional)
      description: Proposed wording or the standard this should defer to.
    validations:
      required: false
