name: validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild catalogue and LLM artefacts
        run: |
          node tools/build-index.js
          node tools/build-llms.js

      - name: Validate metadata, naming, links and artefacts
        run: node tools/validate.js

      - name: Fail if generated artefacts are stale
        run: |
          if ! git diff --quiet -- index.json llms.txt llms-full.txt; then
            echo "::error::index.json / llms.txt are out of date — run 'npm run build' and commit the result."
            git --no-pager diff --stat -- index.json llms.txt llms-full.txt
            exit 1
          fi
          echo "Generated artefacts are in sync."
